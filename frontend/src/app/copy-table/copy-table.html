<div class="copy-table">
  <div class="copy-table-toolbar">
    <p-button
      type="button"
      icon="pi pi-copy"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      styleClass="copy-button"
      [ariaLabel]="tooltip"
      (mouseenter)="hovering = true"
      (mouseleave)="hovering = false"
      (focus)="hovering = true"
      (blur)="hovering = false"
      (onClick)="copy()"
    />
    @if (showTooltip) {
      <span class="copy-tooltip" role="status">{{ tooltip }}</span>
    }
  </div>
  <div
    class="copy-table-scroll"
    tabindex="0"
    role="region"
    [attr.aria-label]="scrollLabel"
  >
    <ng-content />
  </div>
</div>
