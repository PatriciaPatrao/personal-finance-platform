<a
  class="skip-link"
  href="#main-content"
  (click)="skipToMain()"
  (keydown)="onSkipKeydown($event)"
>
  Skip to main content
</a>

<header class="app-shell-header">
  <div class="app-shell-brand">
    <span class="app-shell-logo" aria-hidden="true">◆</span>
    <div>
      <p class="brand-title">Personal Finance Platform</p>
      <p class="brand-tagline">Household financial resilience</p>
    </div>
  </div>

  @if (isAuthenticated$ | async) {
    <p-button
      class="sign-out-btn"
      label="Sign out"
      severity="secondary"
      [text]="true"
      (onClick)="signOut()"
    />
  }

  <nav aria-label="Primary" class="desktop-nav">
  <p-menubar [model]="navItems" class="app-menubar">
    <ng-template #item let-item>
      @if (item.routerLink) {
        <a
          class="p-menubar-item-link"
          [routerLink]="item.routerLink"
          routerLinkActive="active-nav"
          [routerLinkActiveOptions]="item.routerLinkActiveOptions ?? { exact: false }"
        >
          @if (item.icon) {
            <i [class]="item.icon"></i>
          }
          <span>{{ item.label }}</span>
        </a>
      }
    </ng-template>
  </p-menubar>
  </nav>

  <div class="mobile-nav-bar">
    <p-button
      #mobileNavTrigger
      type="button"
      icon="pi pi-bars"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      ariaLabel="Open navigation menu"
      (onClick)="openMobileNav()"
    />
  </div>
</header>

<p-drawer
  [(visible)]="mobileNavOpen"
  position="left"
  header="Navigate"
  styleClass="app-mobile-drawer"
  (onHide)="onMobileNavHide()"
>
  <nav aria-label="Primary mobile">
    <ul class="mobile-nav-list">
      @for (item of navItems; track item.label) {
        <li>
          <a
            [routerLink]="item.routerLink"
            routerLinkActive="active-nav"
            [routerLinkActiveOptions]="item.routerLinkActiveOptions ?? { exact: false }"
            (click)="mobileNavOpen = false"
          >
            @if (item.icon) {
              <i [class]="item.icon"></i>
            }
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</p-drawer>

<main id="main-content" class="app-main" tabindex="-1">
  <router-outlet />
</main>
