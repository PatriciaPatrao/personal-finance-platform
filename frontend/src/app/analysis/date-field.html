<label class="field-label" [attr.for]="inputId">{{ label }}</label>
<div class="date-control">
  <input
    [id]="inputId"
    type="text"
    [name]="name"
    inputmode="numeric"
    placeholder="DD-MM-YYYY"
    maxlength="10"
    autocomplete="off"
    [value]="value"
    (input)="onInput($event)"
  />
  <button
    type="button"
    class="calendar-button"
    [attr.aria-label]="'Open calendar for ' + label"
    [attr.aria-controls]="calendarId"
    [attr.aria-expanded]="open"
    (click)="toggleCalendar($event)"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <rect x="1.5" y="2.5" width="13" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.25" />
      <path d="M1.5 6.5h13M5 1.5v2.5M11 1.5v2.5" fill="none" stroke="currentColor" stroke-width="1.25" />
    </svg>
  </button>

  @if (open) {
    <button
      type="button"
      class="calendar-backdrop"
      aria-label="Close calendar"
      (click)="open = false"
    ></button>
    <div class="calendar" role="dialog" [id]="calendarId" [attr.aria-label]="'Choose ' + label">
      <div class="calendar-header">
        <button
          type="button"
          class="month-button"
          aria-label="Previous month"
          (click)="previousMonth()"
        >
          ‹
        </button>
        <p class="month-label">{{ monthLabel }}</p>
        <button
          type="button"
          class="month-button"
          aria-label="Next month"
          (click)="nextMonth()"
        >
          ›
        </button>
      </div>
      <div class="weekdays" aria-hidden="true">
        @for (weekday of weekdays; track weekday) {
          <span>{{ weekday }}</span>
        }
      </div>
      <div class="days">
        @for (day of calendarDays; track day.iso) {
          <button
            type="button"
            class="day"
            [class.outside]="!day.inMonth"
            [class.selected]="day.selected"
            [class.today]="day.today"
            [disabled]="day.disabled"
            [attr.data-date]="day.iso"
            [attr.aria-label]="day.label"
            [attr.aria-pressed]="day.selected"
            (click)="selectDay(day)"
          >
            {{ day.dayNumber }}
          </button>
        }
      </div>
    </div>
  }
</div>
