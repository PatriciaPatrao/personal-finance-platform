<label class="field-label" [attr.for]="inputId">{{ label }}</label>
<div class="date-control">
  <input
    pInputText
    [id]="inputId"
    type="text"
    [name]="name"
    inputmode="numeric"
    placeholder="DD-MM-YYYY"
    maxlength="10"
    autocomplete="off"
    class="w-full"
    [value]="value"
    [attr.aria-describedby]="errorDescribedBy"
    [attr.aria-invalid]="invalid ? 'true' : null"
    [attr.aria-required]="required ? 'true' : null"
    (input)="onInput($event)"
  />
  <p-button
    type="button"
    icon="pi pi-calendar"
    severity="secondary"
    [text]="true"
    styleClass="calendar-button"
    [ariaLabel]="'Open calendar for ' + label"
    [attr.aria-controls]="calendarId"
    [attr.aria-expanded]="open"
    (onClick)="toggleCalendar($event)"
  />

  @if (open) {
    <button
      type="button"
      class="calendar-backdrop"
      aria-label="Close calendar"
      (click)="closeCalendar()"
    ></button>
    <div class="calendar" role="dialog" [id]="calendarId" [attr.aria-label]="'Choose ' + label">
      <div class="calendar-header">
        <p-button
          type="button"
          icon="pi pi-chevron-left"
          severity="secondary"
          [text]="true"
          styleClass="month-button"
          ariaLabel="Previous month"
          (onClick)="previousMonth()"
        />
        <p class="month-label">{{ monthLabel }}</p>
        <p-button
          type="button"
          icon="pi pi-chevron-right"
          severity="secondary"
          [text]="true"
          styleClass="month-button"
          ariaLabel="Next month"
          (onClick)="nextMonth()"
        />
      </div>
      <div class="weekdays" aria-hidden="true">
        @for (weekday of weekdays; track weekday) {
          <span>{{ weekday }}</span>
        }
      </div>
      <div class="days">
        @for (day of calendarDays; track day.iso) {
          <button
            type="button"
            class="day"
            [class.outside]="!day.inMonth"
            [class.selected]="day.selected"
            [class.today]="day.today"
            [disabled]="day.disabled"
            [attr.data-date]="day.iso"
            [attr.aria-label]="day.label"
            [attr.aria-pressed]="day.selected"
            (click)="selectDay(day)"
          >
            {{ day.dayNumber }}
          </button>
        }
      </div>
    </div>
  }
</div>
